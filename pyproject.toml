[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilab"
version = "0.1.0"
description = "Simulated robotic-lab controller: concurrent orchestration, fault injection, latency measurement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.2", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
minilab = "minilab.cli:main"

[tool.setuptools.packages.find]
include = ["minilab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30                 # a hung/deadlocked test must FAIL, never hang CI
testpaths = ["tests"]
markers = ["bugrepro: deliberately demonstrates a planted bug (see docs/BUGS_FOUND.md)"]

[tool.ruff]
line-length = 100
target-version = "py311"

